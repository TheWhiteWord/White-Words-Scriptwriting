[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "white-words-scriptwriting"
version = "0.1.0"
description = "Story-writing environment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "rapidfuzz>=3.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
    "regex>=2026.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
white-words = "white_words.scriptwriting.app.launcher:main"

[tool.setuptools.packages.find]
# white_words/ is the studio namespace and deliberately has no __init__.py: the
# apps are its children (white_words.scriptwriting today), so a second one can
# join as white_words.film — in this repo or in its own distribution — without
# taking a top-level package name of its own.
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"white_words.scriptwriting" = ["web/**/*", "data/**/*"]

[tool.pytest.ini_options]
# The suite is tests/. tasks/ holds historical task artefacts — plans, patches and
# one importable test — and is deliberately not collected.
testpaths = ["tests"]
